name: Build APK (TWA)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (integer)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      # Bubblewrap asks interactive questions if this file is absent.
      # Populate it before running ANY Bubblewrap command.
      - name: Configure Bubblewrap non-interactively
        run: |
          mkdir -p "$HOME/.bubblewrap"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"],
          }
          path = Path.home() / ".bubblewrap" / "config.json"
          path.write_text(json.dumps(config, indent=2) + "\n")
          print("Bubblewrap configured:")
          print("  JDK:", config["jdkPath"])
          print("  Android SDK:", config["androidSdkPath"])
          PY

      - name: Create signing keystore (temporary for this build)
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Gielinor Wayfinder, OU=Dev, O=Sammy-Salt, C=US"

      - name: Prepare TWA build directory
        run: |
          set -euo pipefail
          mkdir -p twa-build
          cp android/twa-manifest.json twa-build/twa-manifest.json
          cp android.keystore twa-build/android.keystore

      - name: Set app version in TWA manifest
        working-directory: twa-build
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("twa-manifest.json")
          data = json.loads(path.read_text())
          version_code = int(os.environ["VERSION_CODE"])
          if version_code < 1:
              raise SystemExit("version_code must be at least 1")
          data["appVersionName"] = os.environ["VERSION_NAME"]
          data["appVersionCode"] = version_code
          path.write_text(json.dumps(data, indent=2) + "\\n")
          print(f"Building version {data['appVersionName']} ({version_code})")
          PY
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}

      - name: Generate Android project from TWA manifest
        working-directory: twa-build
        run: |
          set -euo pipefail
          bubblewrap update --skipVersionUpgrade
          test -s manifest-checksum.txt

      - name: Build signed APK
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android

          APK="app-release-signed.apk"
          if [ ! -s "$APK" ]; then
            APK="$(find . -type f -name '*signed*.apk' -print -quit)"
          fi
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Bubblewrap completed without producing a signed APK."
            find . -type f \( -name '*.apk' -o -name '*.aab' \) -print
            exit 1
          fi
          echo "APK_PATH=twa-build/$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gielinor-wayfinder-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
