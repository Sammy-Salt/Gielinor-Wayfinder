name: Gielinor Wayfinder CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Verify project, tests, JSON, and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run project verifier
        run: python scripts/verify_project.py

      - name: Run PASS regression suite
        run: python -m pytest -q

      - name: Validate every shipped JSON file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path("site").rglob("*.json"):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("Invalid JSON files:\n" + "\n".join(failures))
          print("JSON validation passed")
          PY

      - name: Validate every shipped JavaScript file
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            node --check "$path"
          done < <(find site -type f -name '*.js' -print0)
          echo "JavaScript syntax validation passed"
