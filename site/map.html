</nav><div id="app-tools-host" aria-label="Application tools"><div id="app-tools" class="app-tools" aria-label="Search and application tools">
<div class="app-search-row"><input id="globalSearch" type="search" autocomplete="off" placeholder="Items, monsters, NPCs, quests..." aria-label="Search the encyclopedia"><button type="button" class="global-search-submit">Search</button></div>
<div id="globalSearchResults" class="global-search-results" role="listbox" aria-label="Search results"></div>
<div class="app-tool-actions"><a href="index.html">⌂ Home</a><button type="button" id="installApp" hidden>Install app</button><button type="button" data-action="export-player">Export player</button><label class="button-like">Import player<input type="file" accept="application/json,.json" hidden></label><span id="offlineStatus" class="offline-status">Checking offline support…</span></div>
</div></div>


<button id="mapToolsToggle" type="button" aria-controls="mapTools" aria-expanded="false">☰ Map tools</button>

<aside id="mapTools" aria-label="Map tools" hidden>
 <div id="toolbar">
  <label class="sr-only" for="search">Search locations</label>
  <input id="search" type="search" placeholder="Search locations..." autocomplete="off">
  <select id="plane" aria-label="Map floor">
   <option value="0">Surface</option>
   <option value="1">Plane 1</option>
   <option value="2">Plane 2</option>
   <option value="3">Plane 3</option>
  </select>
 </div>
 <fieldset id="layerSwitches">
  <legend>Show on map</legend>
  <label><input type="checkbox" data-kind="Shop" checked> Shops</label>
  <label><input type="checkbox" data-kind="NPC" checked> NPCs</label>
  <label><input type="checkbox" data-kind="Monster" checked> Monsters</label>
 </fieldset>
 <div id="results"></div>
 <div id="info"></div>
 <div id="legend">
  <button id="legendHeader" type="button" aria-expanded="true">🗺️ Map Key <span aria-hidden="true">▼</span></button>
  <div id="legendBody">
   <label class="sr-only" for="legendSearch">Search legend</label>
   <input id="legendSearch" type="search" placeholder="Search legend...">
   <div id="legendContent"></div>
   <button id="legendClear" type="button">Clear markers</button>
  </div>
 </div>
</aside>
<div id="map"></div>

<script src="data/map/leaflet/leaflet.js"></script>
<script src="data/map/locations.js?v=2"></script>
<script src="data/map/npcs.js?v=2"></script>
<script src="data/map/monsters.js?v=2"></script>
<script src="data/map/shops.js"></script>
<script src="data/map/points.js"></script>

<script src="js/pages/map.js"></script>

<script type="module" src="js/bootstrap.js?v=42"></script>
</body>
