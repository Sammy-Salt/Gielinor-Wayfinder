<header><h1>Combat Calculator</h1></header><main>

<div class="card">
<label>Monster</label>
<select id="monster" aria-label="Monster"></select>

<label>Combat style</label>
<select id="style" aria-label="Combat style">
<option value="melee">Melee</option>
<option value="ranged">Ranged</option>
<option value="magic">Magic</option>
</select>

<div class="grid">
<div>
<label>Attack level</label>
<input id="attack" type="number" min="1" value="70" aria-label="Attack level">
</div>
<div>
<label>Strength / Ranged / Magic</label>
<input id="power" type="number" min="1" value="70" aria-label="Strength / Ranged / Magic level">
</div>
<div>
<label>Attack bonus</label>
<input id="attBonus" type="number" value="50" aria-label="Attack bonus">
</div>
<div>
<label>Strength / Ranged bonus</label>
<input id="strBonus" type="number" value="50" aria-label="Strength / Ranged bonus">
</div>
<div>
<label>Weapon max hit</label>
<input id="maxHit" type="number" min="0" value="20" aria-label="Weapon max hit">
</div>
<div>
<label>Attack speed (ticks)</label>
<input id="speed" type="number" min="1" value="4" aria-label="Attack speed in ticks">
</div>
</div>
</div>

<div id="result"></div>
</main>

<script src="js/local-loader.js?v=42"></script>
